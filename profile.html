<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 邻里帮帮帮</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; min-height: 100vh; padding: 20px 16px; background: #f1f8e9; font-family: -apple-system, sans-serif; color: #333; }
    .nav { max-width: 600px; margin: 0 auto 20px; }
    .nav button { background: #fff; border: 2px solid #4CAF50; color: #4CAF50; padding: 6px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px;}
    
    /* 头部卡片 */
    .profile-header { background: #fff; max-width: 600px; margin: 0 auto 20px; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
    .avatar { width: 80px; height: 80px; background: #e8f5e9; color: #4CAF50; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 15px; }
    .user-email { font-size: 20px; font-weight: bold; color: #1565c0; margin: 0 0 5px; }
    .user-id { font-size: 12px; color: #999; }
    
    /* 数据小卡片 */
    .stats-grid { max-width: 600px; margin: 0 auto 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .stat-card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; color: #ffb300; margin-bottom: 5px; }
    .stat-label { font-size: 14px; color: #666; }

    /* 帖子列表区域 */
    .section-title { max-width: 600px; margin: 30px auto 15px; color: #1565c0; font-size: 18px; font-weight: bold; border-left: 4px solid #4CAF50; padding-left: 10px; }
    .post-list { max-width: 600px; margin: 0 auto; }
    .post-card { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; }
    .post-content { font-size: 15px; margin: 10px 0; }
    .post-date { font-size: 12px; color: #999; }
    .empty-msg { text-align: center; color: #999; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="nav">
    <button onclick="location.href='index.html'">← 回首页</button>
  </div>

  <div id="loading" style="text-align:center; color:#666; margin-top:50px;">数据加载中...</div>

  <div id="profileContent" style="display: none;">
    <!-- 个人信息 -->
    <div class="profile-header">
      <div class="avatar">👤</div>
      <h2 class="user-email" id="userEmail">加载中...</h2>
      <div class="user-id" id="userId">ID: ...</div>
    </div>

    <!-- 评分与认证 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" style="color: #4CAF50;">✅</div>
        <div class="stat-label">已实名认证</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">⭐ 5.0</div>
        <div class="stat-label">我的评分</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">RM 0.00</div>
        <div class="stat-label">可用余额</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">RM 0.00</div>
        <div class="stat-label">托管中</div>
      </div>
    </div>

    <!-- 我的发帖记录 -->
    <div class="section-title">我的发帖记录</div>
    <div class="post-list" id="myPostsList"></div>
  </div>

  <script src="common.js"></script>
  <script>
    async function loadProfile() {
      // 1. 获取当前登录用户
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      
      if (!session) {
        alert("请先登录！");
        location.href = 'login.html';
        return;
      }

      const user = session.user;

      // 2. 显示基本资料
      document.getElementById('userEmail').innerText = user.email.split('@')[0];
      document.getElementById('userId').innerText = 'ID: ' + user.id.substring(0, 8);
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('profileContent').style.display = 'block';

      // 3. 去数据库查“我发过的帖子”
      loadMyPosts(user.id);
    }

    // 4. 加载我的帖子列表
    async function loadMyPosts(userId) {
      const { data: posts, error } = await window.supabaseClient
        .from('posts')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      const listDiv = document.getElementById('myPostsList');

      if (error) {
        listDiv.innerHTML = `<div class="empty-msg">加载失败：${error.message}</div>`;
        return;
      }

      if (!posts || posts.length === 0) {
        listDiv.innerHTML = `<div class="empty-msg">你还没有发过帖子哦，去首页发一个吧！</div>`;
        return;
      }

      listDiv.innerHTML = posts.map(p => {
        const date = new Date(p.created_at).toLocaleDateString();
        return `
          <div class="post-card" onclick="goDetail('${p.id}')">
            <span style="background:#e8f5e9; color:#4CAF50; padding:2px 8px; border-radius:10px; font-size:12px;">${p.category || '其他'}</span>
            <p class="post-content">${p.content}</p>
            <div class="post-date">发布于: ${date}</div>
          </div>
        `;
      }).join('');
    }

    // 启动
    loadProfile();
  </script>
</body>
</html>
